[project]
name = "emmlab"
version = "0.1.0"
description = "Ground-truth laboratory for Exceptional Model Mining on path models"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pysubgroup==0.8.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "pydantic>=2",
    "ruamel.yaml>=0.18",
    "pyarrow>=17",
    "duckdb>=1.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
lab = "emmlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.6",
    "basedpyright>=1.20",
    "httpx>=0.27",
    "sempler>=0.2.14",
    "semopy>=2.3",
    "plspm>=0.5.7",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emmlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: statistical Monte Carlo tests (minutes)",
    "oracle: cross-checks against independent libraries",
    "criterion(id): acceptance criterion ID",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/emmlab/report.py" = ["E501"]  # inline HTML templates
"scripts/offline_preview.py" = ["E501"]  # inline JS shim
